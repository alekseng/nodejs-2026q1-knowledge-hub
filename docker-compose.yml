version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-hub-app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-4000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer
    container_name: knowledge-hub-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network
    profiles:
      - debug

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
